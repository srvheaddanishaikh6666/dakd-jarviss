name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix missing files
        run: |
          echo "=== Fixing keystore ==="
          # Create debug keystore at all possible locations
          mkdir -p ~/.android/
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          
          for p in "./debug.keystore" "./app/debug.keystore" "./dakd-jarvis/debug.keystore" "./dakd-jarvis/app/debug.keystore" "dakd-jarvis/dakd-jarvis/debug.keystore" "dakd-jarvis/dakd-jarvis/dakd-jarvis/debug.keystore"; do
            mkdir -p $(dirname "$p")
            cp ~/.android/debug.keystore "$p" 2>/dev/null || keytool -genkey -v -keystore "$p" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          done

          echo "=== Fixing GEMINI_API_KEY ==="
          # Create .env files
          echo "GEMINI_API_KEY=dummy_key_for_build_12345" > .env
          echo "GEMINI_API_KEY=dummy_key_for_build_12345" > .env.example
          if [ -d "dakd-jarvis" ]; then
            echo "GEMINI_API_KEY=dummy_key_for_build_12345" > dakd-jarvis/.env
            echo "GEMINI_API_KEY=dummy_key_for_build_12345" > dakd-jarvis/.env.example
            echo "sdk.dir=$ANDROID_HOME" > dakd-jarvis/local.properties
          fi
          if [ -d "app" ]; then
            echo "GEMINI_API_KEY=dummy_key_for_build_12345" > app/.env
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Create gradle.properties
          echo "GEMINI_API_KEY=dummy_key_for_build_12345" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties
          
          echo "=== Patching AIConfig.kt ==="
          AI_FILE=$(find . -name "AIConfig.kt" | head -1)
          if [ -f "$AI_FILE" ]; then
            echo "Found $AI_FILE"
            # Replace BuildConfig.GEMINI_API_KEY with hardcoded string to allow build
            sed -i 's/BuildConfig.GEMINI_API_KEY/"dummy_key_for_build_12345"/g' "$AI_FILE" || true
            sed -i 's/GEMINI_API_KEY/"dummy_key_for_build_12345"/g' "$AI_FILE" || true
            cat "$AI_FILE"
          fi

      - name: Build APK
        run: |
          export GEMINI_API_KEY="dummy_key_for_build_12345"
          # Find gradlew
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            DIR=$(dirname "$GRADLEW")
            echo "Building from $DIR using $GRADLEW"
            cd "$DIR"
            ./gradlew assembleDebug --stacktrace -P GEMINI_API_KEY=dummy_key_for_build_12345 || ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew found, using gradle"
            gradle assembleDebug --stacktrace -P GEMINI_API_KEY=dummy_key_for_build_12345 || gradle assembleDebug
          fi
        env:
          GEMINI_API_KEY: dummy_key_for_build_12345
          ORG_GRADLE_PROJECT_GEMINI_API_KEY: dummy_key_for_build_12345

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dakd-jarvis-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
